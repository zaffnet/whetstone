# For the `gitleaks dir` scan in `just validate`, which walks the filesystem and does not
# read .gitignore. Kept separate from .gitleaks.toml, which the pre-commit hook and the
# full-history scan use: .gitignore does not stop `git add -f` and does not cover an
# already-tracked file, so a secret committed as credentials.local.json stays visible there.
title = "whetstone working tree"

[extend]
path = ".gitleaks.toml"

[allowlist]
description = "Paths git ignores, where a finding can never reach the repo"
paths = [
  # .gitignore:2-3 are *.local and *.local.*, which match directories as well as files.
  '''(^|/)[^/]*\.local(\.[^/]+)?($|/)''',
]
