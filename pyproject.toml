[project]
name = "whetstone"
version = "0.1.0"
description = "Sharpen the tools: macOS dotfiles, a Python project template, and agent skills."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "basedpyright>=1.39",
    "copier>=9.18.2",
    "mypy>=2.3",
    "pre-commit>=4.6.1",
    "pyrefly>=1.2",
    "ruff>=0.16.7",
]

[tool.mypy]
python_version = "3.12"
mypy_path = "stubs"
files = ["bin/sync-mcp", "bin/sync-iterm2-profile"]
scripts_are_modules = true
strict = true
pretty = true
warn_unused_configs = true

[tool.basedpyright]
include = ["bin/sync-mcp", "bin/sync-iterm2-profile"]
exclude = [".venv", "node_modules", "template"]
typeCheckingMode = "all"
stubPath = "stubs"
reportMissingImports = "error"
reportMissingTypeStubs = false
pythonVersion = "3.12"

[tool.pyrefly]
preset = "all"
check-unannotated-defs = true
strict-callable-subtyping = true
strict-partial-subtyping = true
project-includes = ["bin/sync-mcp", "bin/sync-iterm2-profile"]
project-excludes = ["**/.venv/", "**/node_modules/", "template/**"]
search-path = ["stubs"]
python-version = "3.12.0"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-include = ["bin/sync-mcp", "bin/sync-iterm2-profile"]

[tool.ruff.lint]
select = ["ALL"]
extend-select = ["E266"]
explicit-preview-rules = true
preview = true
ignore = ["D100", "D101", "D102", "D103", "D104", "D105", "D203", "D213", "COM812", "FIX", "TD", "TRY003", "CPY001"]

[tool.ruff.lint.per-file-ignores]
# Stubs may still trip ANN401 on catch-all kwargs; ignore it for .pyi files.
"*.pyi" = ["ANN401"]
