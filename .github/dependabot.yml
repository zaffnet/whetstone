version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    groups:
      hooks:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      tooling:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps-dev)"
