version: 2
updates:
  # One entry over both directories, not two. The template ships the same SHA pins as the
  # root workflows, and `single-source` compares them, so a bump that moves one copy and
  # not the other goes red on dependabot's own pull request. Two `directory` entries would
  # still do that -- they are independent update streams. `group-by: dependency-name`
  # is what puts both copies of an action in the same PR.
  - package-ecosystem: github-actions
    directories:
      - /
      - /template/project
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
        group-by: dependency-name
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    groups:
      hooks:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"

  # The root pyproject.toml holds only the tooling (copier, pre-commit, ruff).
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      tooling:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps-dev)"
