# pr-medic: drive open pull requests to merged. Logic lives in .github/pr-medic/; this file is
# orchestration only, and must not become a required check. Design: ADR 0012.
name: pr-medic

# workflow_run wants literal names, and there is no wildcard. A host whose names differ falls
# back to the cron below. This one line is the only difference from the template's copy.
on:
  workflow_run:
    workflows: ["lint", "macos", "secrets", "template", "CodeQL"]
    types: [completed]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]
  issue_comment:
    types: [created]
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number; blank sweeps every open PR"
        required: false

permissions: {}

# Never cancel: a cancel mid-run can leave the remote looking finished on an unfixed head.
concurrency:
  group: pr-medic-${{ github.event.workflow_run.head_sha || github.run_id }}
  cancel-in-progress: false

env:
  # 0 because self-approval is forbidden and Copilot cannot approve. Counted by push access.
  APPROVALS_REQUIRED: "0"
  # Set the repository variable to "true" to let the medic land pull requests unattended.
  MAY_MERGE: ${{ vars.PR_MEDIC_MAY_MERGE || 'false' }}
  MERGE_METHOD: squash # squash | rebase | merge
  SKIP_LABEL: no-medic
  REREQUEST_REVIEWERS: copilot-pull-request-reviewer[bot]
  # Bots whose event may wake the medic; its own login is added at runtime in the `bot` step.
  TRIGGER_BOTS: copilot-pull-request-reviewer[bot],dependabot[bot]
  MAX_TURNS: "60"

jobs:
  pick:
    if: >-
      github.event_name != 'workflow_run'
      || contains(fromJSON('["success","failure","timed_out"]'), github.event.workflow_run.conclusion)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      checks: read
      statuses: read
      actions: read # statusCheckRollup resolves each check run's workflow name
    outputs:
      prs: ${{ steps.pick.outputs.prs }}
      count: ${{ steps.pick.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: pick
        run: .github/pr-medic/pick.sh
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_INPUT: ${{ inputs.pr }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}

  medic:
    needs: pick
    # Positive on both terms: fromJSON('') below is a matrix error no job setting can absorb.
    if: needs.pick.outputs.count != '' && needs.pick.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: write
      pull-requests: write
      issues: write
      checks: read
      statuses: read
      actions: write
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        pr: ${{ fromJSON(needs.pick.outputs.prs) }}
    concurrency:
      group: pr-medic-${{ matrix.pr }}
      cancel-in-progress: false
    env:
      HAS_CLAUDE: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' || secrets.ANTHROPIC_API_KEY != '' }}
      PR: ${{ matrix.pr }}
      REPO: ${{ github.repository }}
    steps:
      # Without an App, pushes use GITHUB_TOKEN and do not re-trigger CI. Downscoped: an App
      # token carries the installation's scope and ignores this job's permissions: block.
      - id: token
        if: vars.APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
          permission-checks: read
          permission-statuses: read
          # write, not read: the prompt tells Claude to `gh run rerun --failed`.
          permission-actions: write

      # For the Claude step alone, with no contents: write -- the action puts the token it is
      # given into the origin URL, so this is what keeps a pushing credential out of the model.
      - id: token-ro
        if: vars.APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: write
          permission-checks: read
          permission-actions: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.token.outputs.token || github.token }}

      # Commits need the bot's noreply address, or unattributed-changes rules block the PR.
      - id: bot
        env:
          GH_TOKEN: ${{ steps.token.outputs.token || github.token }}
          APP_SLUG: ${{ steps.token.outputs.app-slug }}
          TRIGGER_BOTS: ${{ env.TRIGGER_BOTS }}
        run: |
          set -euo pipefail
          login=${APP_SLUG:+${APP_SLUG}[bot]}
          login=${login:-github-actions[bot]}
          id=$(gh api "/users/$login" --jq .id)
          git config user.name "$login"
          git config user.email "$id+$login@users.noreply.github.com"
          gh auth setup-git
          gh pr checkout "$PR"
          # Everything below runs out of the checkout, which is now the PR's -- after.sh
          # included. Take .github/pr-medic from the default branch first, so the gate is ours.
          base=$(gh api "repos/$REPO" --jq .default_branch)
          git fetch --depth=1 --no-recurse-submodules origin "$base"
          git checkout "origin/$base" -- .github/pr-medic ||
            echo "::warning::.github/pr-medic is absent from $base; using the PR's copy"
          git reset -q -- .github/pr-medic
          .github/pr-medic/trust-config.sh
          # Threads in as a file, replies out as a file; after.sh posts them.
          .github/pr-medic/threads.sh dump
          {
            echo "prompt<<PROMPT"
            cat .github/pr-medic/prompt.md
            echo PROMPT
          } >>"$GITHUB_OUTPUT"
          # $login leads the bot allowlist: after a medic push, github.actor is this bot.
          printf 'login=%s\nid=%s\nhead=%s\nbots=%s\n' \
            "$login" "$id" "$(git rev-parse HEAD)" "$login,$TRIGGER_BOTS" >>"$GITHUB_OUTPUT"

      - name: Run Claude Code
        if: env.HAS_CLAUDE == 'true'
        uses: anthropics/claude-code-action@9dcab633034361127cf74336d2d891d02e887881 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ steps.token-ro.outputs.token || github.token }}
          allowed_bots: ${{ steps.bot.outputs.bots }}
          use_commit_signing: false
          bot_id: ${{ steps.bot.outputs.id }}
          bot_name: ${{ steps.bot.outputs.login }}
          # Inline, not a path: a file in the checkout is PR-controlled and not in
          # SENSITIVE_PATHS. `.git` is denied for reads too, in case a credential lands there.
          settings: |
            {"permissions":{"deny":["Bash(gh api:*)","Bash(gh pr comment:*)","Bash(gh pr merge:*)","Bash(gh pr review:*)","Bash(git push --force)","Bash(git push --force *)","Bash(just:*)","Bash(uv run:*)","Bash(git rebase --exec:*)","Bash(git rebase -x:*)","Bash(git fetch:*)","Bash(git push:*)","Bash(git push)","Bash(git commit:*)","Bash(git diff --no-index:*)","Bash(git diff --ext-diff:*)","Bash(git log --ext-diff:*)","Bash(git show --ext-diff:*)","Write(.git/**)","Edit(.git/**)","Read(.git/**)","Grep(.git/**)","Glob(.git/**)","Read(**/.git/**)"]}}
          # An allowlist, not only the deny block: agent mode sets neither --permission-mode
          # nor --allowedTools, so the model would otherwise have Read, Grep and Glob only.
          # Nothing on it launches a command or reads a file it names: rebase, fetch, diff,
          # commit and `gh pr comment` all could, so each goes via a helper. ADR 0012.
          claude_args: >-
            --max-turns ${{ env.MAX_TURNS }}
            --permission-mode acceptEdits
            --add-dir ${{ runner.temp }}/pr-medic
            --allowedTools "Read,Grep,Glob,Edit,Write,TodoWrite,Bash(git status:*),Bash(git diff),Bash(git diff --stat),Bash(git diff --cached),Bash(git diff HEAD),Bash(git log:*),Bash(git show:*),Bash(git add:*),Bash(git checkout --ours:*),Bash(git checkout --theirs:*),Bash(git rebase --continue),Bash(git rebase --abort),Bash(.github/pr-medic/rebase.sh),Bash(.github/pr-medic/commit.sh:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh run view:*),Bash(gh run list:*),Bash(gh run rerun:*)"
          prompt: ${{ steps.bot.outputs.prompt }}

      - if: failure()
        run: tail -c 4000 "$RUNNER_TEMP/claude-execution-output.json"

      - name: Gate and arm
        run: .github/pr-medic/after.sh
        env:
          GH_TOKEN: ${{ steps.token.outputs.token || github.token }}
          HEAD_BEFORE: ${{ steps.bot.outputs.head }}
