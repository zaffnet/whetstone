name: macos

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 6 * * 1" # Mondays 06:41 UTC

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        role: [personal, work]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # uv: tests/home.bats parses TOML through it, because the system python3 on macOS
      # has no tomllib. A real machine gets uv from the Brewfile.
      - run: brew install chezmoi bats-core jq uv
      - name: Write the chezmoi config
        env:
          ROLE: ${{ matrix.role }}
        run: |
          chezmoi init --source "$GITHUB_WORKSPACE" \
            --promptString "name=T,email=t@example.com,src_dir=src" \
            --promptChoice "role=$ROLE"
          if [ "$ROLE" = work ]; then
            # The generated config has an empty [data.work] table; fill it in place.
            perl -0pi -e 's/^\[data\.work\]\n/[data.work]\n  branch_prefix = "ci\/"\n  openai_base_url = "https:\/\/proxy.example\/v1"\n  aws_profile = "example"\n  pypi_index_url = "https:\/\/pypi.example\/simple"\n  code_scan_command = "\/opt\/example\/code-scan"\n/m' \
              ~/.config/chezmoi/chezmoi.toml
          fi
      - name: Apply the chezmoi tree into the runner home
        env:
          CI: "1"
        run: |
          start=$SECONDS
          chezmoi apply --source "$GITHUB_WORKSPACE"
          echo "Apply (CI mode, no package installs): $((SECONDS - start))s" >> "$GITHUB_STEP_SUMMARY"
      - name: Run the suite, and check that only the known cases skip
        env:
          ROLE: ${{ matrix.role }}
        run: |
          bats --formatter tap tests/ | tee /tmp/tap.txt
          # tests/home.bats states which conditions skip a case. Pinning the set here is
          # what keeps that honest: a skip nobody declared is the shape that let the
          # regression through on #10, where a guard fired exactly when the behaviour
          # under test broke.
          expected=$(
            echo "the secrets file, when present, is readable only by its owner"
            if [ "$ROLE" = work ]; then
              echo "git identity comes from chezmoi data (CI home only)"
            fi
          )
          skipped=$(sed -nE 's/^ok [0-9]+ (.*) # skip .*/\1/p' /tmp/tap.txt)
          diff <(printf '%s\n' "$expected" | sort) <(printf '%s\n' "$skipped" | sort)
      - name: Rendered config parses and carries the work values
        if: matrix.role == 'work'
        run: |
          uv run --no-project --python 3.12 python -c \
            'import tomllib, pathlib; tomllib.loads(pathlib.Path.home().joinpath(".codex/config.toml").read_text())'
          jq -e '.mcpServers["aws-mcp"].env.AWS_PROFILE == "example"' ~/.agents/mcp.json
          jq -e '.mcpServers["code-scan"] == {command: "/opt/example/code-scan", args: ["mcp-server"]}' \
            ~/.agents/mcp.json
          grep -q 'proxy.example' ~/.codex/config.toml
          grep -q 'pypi.example' ~/.config/uv/uv.toml
