name: macos

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 6 * * 1" # Mondays 06:41 UTC

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        role: [personal, work]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # uv: the rendered-config step parses TOML through it, because the system python3 on
      # macOS has no tomllib. A real machine gets uv from the Brewfile.
      - run: brew install chezmoi jq uv
      - name: Write the chezmoi config
        env:
          ROLE: ${{ matrix.role }}
        run: |
          chezmoi init --source "$GITHUB_WORKSPACE" \
            --promptString "name=T,email=t@example.com,src_dir=src" \
            --promptChoice "role=$ROLE"
          if [ "$ROLE" = work ]; then
            # The generated config has an empty [data.work] table; fill it in place.
            perl -0pi -e 's/^\[data\.work\]\n/[data.work]\n  branch_prefix = "ci\/"\n  openai_base_url = "https:\/\/proxy.example\/v1"\n  aws_profile = "example"\n  pypi_index_url = "https:\/\/pypi.example\/simple"\n  code_scan_command = "\/opt\/example\/code-scan"\n/m' \
              ~/.config/chezmoi/chezmoi.toml
          fi
      - name: Apply the chezmoi tree into the runner home
        env:
          CI: "1"
        run: |
          start=$SECONDS
          chezmoi apply --source "$GITHUB_WORKSPACE"
          echo "Apply (CI mode, no package installs): $((SECONDS - start))s" >> "$GITHUB_STEP_SUMMARY"
      - name: Rendered config parses and carries the work values
        if: matrix.role == 'work'
        run: |
          uv run --no-project --python 3.12 python -c \
            'import tomllib, pathlib; tomllib.loads(pathlib.Path.home().joinpath(".codex/config.toml").read_text())'
          jq -e '.mcpServers["aws-mcp"].env.AWS_PROFILE == "example"' ~/.agents/mcp.json
          jq -e '.mcpServers["code-scan"] == {command: "/opt/example/code-scan", args: ["mcp-server"]}' \
            ~/.agents/mcp.json
          grep -q 'proxy.example' ~/.codex/config.toml
          grep -q 'pypi.example' ~/.config/uv/uv.toml

  # One stable context for the branch ruleset to require. `bootstrap` carries its matrix
  # value in the job name, so adding a role or a second macOS version renames both required
  # contexts and the ruleset waits on names no job produces. That blocked main outright once
  # already, on template.yml, which is why template-ok exists; this name never changes.
  #
  # always() so a failed dependency still runs it. Without it the job is skipped, and a
  # skipped required check passes the ruleset.
  macos-ok:
    if: always()
    needs: [bootstrap]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every bootstrap job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || { echo "a bootstrap job did not succeed"; exit 1; }
          done
