name: claude

# Claude Code on CI, for the same jobs the local agents do: answer an @claude mention,
# review a pull request, resolve its threads, and land it through bin/merge-pr.sh
# (ADR 0012).
#
# No model credential is stored in this repository. The run federates: GitHub mints an OIDC
# token for the job, AWS exchanges it for a session on a role that trusts only this repo,
# and the Anthropic key is read from Secrets Manager with that session. Nothing here
# outlives the job. docs/ci-claude-auth.md has the trust policy and the commands that
# create it; until the two variables exist the job skips instead of failing, so a fork
# sees no red run it cannot fix.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [assigned]

permissions:
  contents: write # push review fixes to the PR branch, and merge
  pull-requests: write # approve, comment, resolve threads, enable auto-merge
  issues: write
  actions: read # read its own check runs when deciding whether a PR is fit to merge
  id-token: write

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    # Only on an explicit @claude, and never on a bot's own comment: Copilot's review text
    # quotes the code under review, and a mention inside it would loop the two of them.
    if: |
      github.event.sender.type != 'Bot' && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && github.event.assignee.login == 'claude')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Variables, not secrets: a role ARN and a secret name are not credentials, and
      # keeping them in the open is what makes a missing setup say so plainly.
      - name: Check the federation is configured
        id: federation
        env:
          ROLE: ${{ vars.CI_AGENT_ROLE_ARN }}
          SECRET: ${{ vars.ANTHROPIC_KEY_SECRET_ID }}
        run: |
          if [ -n "$ROLE" ] && [ -n "$SECRET" ]; then
            echo "ready=true" >>"$GITHUB_OUTPUT"
          else
            echo "ready=false" >>"$GITHUB_OUTPUT"
            echo "::notice::CI_AGENT_ROLE_ARN or ANTHROPIC_KEY_SECRET_ID is unset; skipping. See docs/ci-claude-auth.md"
          fi

      # Exchanges the job's OIDC token for a session on the role. No access key exists to
      # leak: the session is minted per run and expires with it.
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        if: steps.federation.outputs.ready == 'true'
        with:
          role-to-assume: ${{ vars.CI_AGENT_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          role-session-name: claude-${{ github.run_id }}

      - name: Read the Anthropic key with that session
        id: key
        if: steps.federation.outputs.ready == 'true'
        env:
          SECRET: ${{ vars.ANTHROPIC_KEY_SECRET_ID }}
        run: |
          key=$(aws secretsmanager get-secret-value --secret-id "$SECRET" \
            --query SecretString --output text)
          # Masked before it is written anywhere, so a later `set -x` or a crash dump
          # cannot print it.
          echo "::add-mask::$key"
          echo "value=$key" >>"$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@c3d45e8e941e1b2ad7b278c57482d9c5bf1f35b3 # v1.0.99
        if: steps.federation.outputs.ready == 'true'
        with:
          anthropic_api_key: ${{ steps.key.outputs.value }}
          # gh is on the runner and authenticates from GITHUB_TOKEN, so the merge gate,
          # the thread resolver, and `gh pr review` all work without extra setup.
          claude_args: |
            --allowed-tools "Bash,Read,Edit,Write,Grep,Glob"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
