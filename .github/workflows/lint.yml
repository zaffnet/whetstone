name: lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv sync --all-groups
      - run: uv run pre-commit run --all-files --show-diff-on-failure

  plugin-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate .

  single-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Template hooks match hooks/
        run: |
          for f in _common.sh ruff_format.sh setup-working-tree.sh; do
            diff -u "hooks/$f" "template/project/.claude/hooks/$f"
          done
      # The pr-medic scripts are copied verbatim. The two workflows differ on one line:
      # workflow_run names workflows literally, and a generated project's are not this
      # repo's. MAY_MERGE is a repository variable, so it is the same in both.
      - name: pr-medic matches the template copy
        run: |
          # -r, not a loop over .github/pr-medic/*: that iterates only the files still present
          # on this side, so deleting a helper here while its template copy stays would pass and
          # generated projects would keep shipping the stale one. Recursive diff fails on an
          # addition or a deletion on either side.
          diff -ru .github/pr-medic template/project/.github/pr-medic
          diff -u \
            <(sed 's/^    workflows: .*/    workflows: PINNED/' .github/workflows/pr-medic.yml) \
            <(sed 's/^    workflows: .*/    workflows: PINNED/' template/project/.github/workflows/pr-medic.yml)
          diff -u .github/workflows/claude.yml template/project/.github/workflows/claude.yml
      # A pinned SHA that does not exist fails the step that uses it and nothing else, so it
      # can sit in a workflow that never runs on this repository's own pull requests.
      - name: Pinned action SHAs exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # -r over the directories, not a *.yml glob: the template ships ci.yaml.jinja, whose
          # pins appear in no .yml file at all, so a nonexistent SHA there would only surface
          # once somebody generated a project from it.
          grep -rhoE 'uses: [A-Za-z0-9._/-]+@[0-9a-f]{40}' \
            .github/workflows template/project/.github/workflows | awk '{print $2}' | sort -u |
            while read -r ref; do
              gh api "repos/${ref%@*}/commits/${ref#*@}" --jq .sha >/dev/null ||
                { echo "::error::$ref does not exist"; exit 1; }
            done

      - name: Reviewer subagents match between Claude markdown and Codex TOML
        run: python3 tools/check-agents-sync.py
