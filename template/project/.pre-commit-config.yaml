default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: pretty-format-json
      - id: detect-private-key
      - id: detect-aws-credentials
        args: [--allow-missing-credentials]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.1
    hooks:
      - id: markdownlint

  - repo: local
    hooks:
      - id: ruff-fix
        name: ruff fix (lint + import sort)
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]

      - id: forbid-section-separator-comments
        name: forbid section-separator comments
        entry: '^\s*#\s*(?:[-=]{3,}|#{2,})(?:\s+.*)?$'
        language: pygrep
        types_or: [python, pyi]

      - id: conventional-commit-subject
        name: conventional commit subject
        entry: '\A(?=[^\n]{1,72}(\n|\Z))((feat|fix|refactor|chore|docs|test|ci|style|perf|build)(\([^()\n]+\))?!?: \S|Merge |Revert ")'
        language: pygrep
        args: [--multiline, --negate]
        stages: [commit-msg]

      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true

      - id: basedpyright
        name: basedpyright
        entry: uv run basedpyright
        language: system
        pass_filenames: false
        always_run: true

      - id: pyrefly
        name: pyrefly
        entry: uv run pyrefly check
        language: system
        pass_filenames: false
        always_run: true

      - id: bandit
        name: bandit
        entry: uv run bandit -c pyproject.toml -r .
        language: system
        pass_filenames: false
        always_run: true

      - id: pip-audit
        name: pip-audit
        entry: uv run pip-audit
        language: system
        pass_filenames: false
        always_run: true

      - id: tests
        name: tests
        entry: >-
          bash -c 'uv run pytest --cov --cov-report=xml'
        language: system
        pass_filenames: false
        always_run: true
