# pr-medic: drive open pull requests to merged. Logic lives in .github/pr-medic/; this file is
# orchestration only, and must not become a required check. Design: ADR 0012.
name: pr-medic

# workflow_run wants literal names and there is no wildcard; a host whose names differ falls
# back to the cron. This one line is the only difference from the template's copy.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]
  issue_comment:
    types: [created]
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number; blank sweeps every open PR"
        required: false

permissions: {}

# Never cancel: a cancel mid-run can leave the remote looking finished on an unfixed head.
concurrency:
  group: pr-medic-${{ github.event.workflow_run.head_sha || github.run_id }}
  cancel-in-progress: false

env:
  # 0 because self-approval is forbidden and Copilot cannot approve. Counted by push access.
  APPROVALS_REQUIRED: "0"
  MAY_MERGE: ${{ vars.PR_MEDIC_MAY_MERGE || 'false' }} # set the repo variable to "true"
  MERGE_METHOD: squash # squash | rebase | merge
  SKIP_LABEL: no-medic # a person saying leave this alone
  # The medic's own: taken before it resolves a thread, lifted once the run has accounted for
  # what it resolved. Separate from SKIP_LABEL so releasing it cannot clear a person's.
  BLOCK_LABEL: medic-blocked
  REREQUEST_REVIEWERS: copilot-pull-request-reviewer[bot]
  # The medic's own login is added at runtime; see the `bot` step.
  TRIGGER_BOTS: copilot-pull-request-reviewer[bot],dependabot[bot]
  MAX_TURNS: "60"

jobs:
  pick:
    if: >-
      github.event_name != 'workflow_run'
      || contains(fromJSON('["success","failure","timed_out"]'), github.event.workflow_run.conclusion)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      checks: read
      statuses: read
      actions: read # statusCheckRollup resolves each check run's workflow name
    outputs:
      prs: ${{ steps.pick.outputs.prs }}
      count: ${{ steps.pick.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: pick
        run: .github/pr-medic/pick.sh
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_INPUT: ${{ inputs.pr }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      # Red, not a warning: the medic job refuses to run without the App, and a green run that
      # did nothing is indistinguishable from a green run that had nothing to do. This is
      # configuration, so it is reported as a configuration error.
      - if: vars.APP_CLIENT_ID == '' && steps.pick.outputs.count != '0'
        run: |
          echo "::error::pr-medic has work but no GitHub App: set the APP_CLIENT_ID variable and"
          echo "::error::the APP_PRIVATE_KEY secret. Without one this job's token would have to be"
          echo "::error::write-capable, and the action copies it into the model's environment as"
          echo "::error::DEFAULT_WORKFLOW_TOKEN."
          exit 1

  medic:
    needs: pick
    # Positive on both terms: fromJSON('') below is a matrix error no job setting can absorb.
    # The App is required, not preferred. The action puts `github.token` in the model's
    # environment as DEFAULT_WORKFLOW_TOKEN (action.yml) and copies the whole environment into
    # the Claude SDK (base-action/src/parse-sdk-options.ts), so a write-capable job token is a
    # write-capable token in the model's reach whatever this workflow passes as github_token.
    # This job's permissions are therefore all read, and every write uses the App token.
    if: >-
      needs.pick.outputs.count != '' && needs.pick.outputs.count != '0'
      && vars.APP_CLIENT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
      pull-requests: read
      issues: read
      checks: read
      statuses: read
      actions: read
      id-token: write # the action's workload-identity path
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        pr: ${{ fromJSON(needs.pick.outputs.prs) }}
    concurrency:
      group: pr-medic-${{ matrix.pr }}
      cancel-in-progress: false
    env:
      HAS_CLAUDE: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' || secrets.ANTHROPIC_API_KEY != '' }}
      PR: ${{ matrix.pr }}
      REPO: ${{ github.repository }}
    steps:
      # Without an App, pushes use GITHUB_TOKEN and do not re-trigger CI. Downscoped because an
      # App token carries the installation's scope and ignores this job's permissions.
      - id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
          permission-checks: read
          permission-statuses: read
          permission-actions: write # write: rerun.sh re-runs this PR's failed checks

      # For the Claude step alone, with no contents: write -- the action puts the token it is
      # given into the origin URL, so this keeps a pushing credential out of the model.
      - id: token-ro
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: read
          # read: an explicit prompt selects the action's agent mode, which creates no tracking
          # comment (src/modes/agent/index.ts sets claudeCommentId undefined, and the update at
          # the end of run.ts is guarded on it), so nothing in this step needs to write. The
          # model's replies are posted by threads.sh, in the gate step, with the App token.
          permission-pull-requests: read
          permission-checks: read
          # read, not write: the action copies this token into the model's subprocess, and every
          # allowed command takes arguments -- `commit.sh "$GH_TOKEN"` would have published it in
          # a commit message that after.sh then pushes. So the model cannot re-run anything; it
          # writes the run ids it wants into reruns.json and the gate step performs them.
          permission-actions: read

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # The read-only one, because this is the credential the model's step inherits.
          # actions/checkout persists it as an http.<server>/.extraheader entry in .git/config,
          # and the Claude action replaces that with the token it was given -- but agent mode
          # catches a failure there and continues (src/modes/agent/index.ts), so a write token
          # here would be left in the working tree with the model. Nothing before the gate needs
          # to write, and the gate installs its own credential.
          token: ${{ steps.token-ro.outputs.token }}

      - id: bot # commits need the bot's noreply address, or attribution rules block the PR
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          APP_SLUG: ${{ steps.token.outputs.app-slug }}
          TRIGGER_BOTS: ${{ env.TRIGGER_BOTS }}
        run: |
          set -euo pipefail
          login=${APP_SLUG:+${APP_SLUG}[bot]}
          login=${login:-github-actions[bot]}
          id=$(gh api "/users/$login" --jq .id)
          git config user.name "$login"
          git config user.email "$id+$login@users.noreply.github.com"
          gh auth setup-git
          gh pr checkout "$PR"
          # The gate must not run a script the model can rewrite, and it has Edit/Write on the
          # checkout -- so take .github/pr-medic from the default branch into RUNNER_TEMP.
          base=$(gh api "repos/$REPO" --jq .default_branch)
          git fetch --depth=1 --no-recurse-submodules origin "$base"
          mkdir -p "$RUNNER_TEMP/medic"
          # Fail closed: the checkout's copy would be PR-controlled, run with the write token.
          git archive "origin/$base" .github/pr-medic 2>/dev/null |
            tar -x --strip-components=2 -C "$RUNNER_TEMP/medic" || {
            echo "::error::.github/pr-medic is absent from $base; the medic cannot run"
            exit 1
          }
          chmod +x "$RUNNER_TEMP/medic"/*.sh
          chmod -R a-w "$RUNNER_TEMP/medic" # --output=FILE writes wherever it is pointed
          # Whose review threads may steer the model: this bot, so its own replies do not
          # withhold every thread it has touched, plus the review bots. threads.sh reads it.
          export TRUSTED_BOTS="$login,$TRIGGER_BOTS"
          "$RUNNER_TEMP/medic/trust-config.sh"
          "$RUNNER_TEMP/medic/threads.sh" dump # threads in as a file, replies out as a file
          # The snapshot and trusted-state are the gate's evidence, and being outside --add-dir
          # only keeps the Write tool off them: every `Bash(... :*)` rule below is a prefix
          # match, so it admits a redirection, and `git status > .../trusted-state` needs no
          # tool at all. Read-only, directory included, so nothing can be rewritten or added.
          # after.sh takes the writes back for resolved.json.
          chmod -R a-w "$RUNNER_TEMP/pr-medic-state"
          # A .git/config the model can write is arbitrary code execution, and from there the
          # read-only bits above come straight off again -- it owns those files. Reproduced:
          # `core.fsmonitor = <command>` in .git/config is run by the allowed `git status`, and
          # .git/hooks is the same by another route. Every `Bash(... :*)` rule is a prefix match,
          # so it admits a redirection as well as the command, and Write(.git/**) does not cover
          # a redirect. Read-only refuses the write outright, even to the owner, and `git add`,
          # `git commit` and `git status` all still work -- only after.sh writes config, and it
          # takes the bit back. Everything above that needs config has already run.
          chmod a-w .git/config
          chmod -R a-w .git/hooks
          printf '[]\n' >"$RUNNER_TEMP/pr-medic/reruns.json" # the model asks; after.sh performs
          mkdir -p "$RUNNER_TEMP/discard" # decoy runner command files; see the Claude step
          {
            echo "prompt<<PROMPT"
            cat "$RUNNER_TEMP/medic/prompt.md"
            echo PROMPT
          } >>"$GITHUB_OUTPUT"
          # $login leads the bot allowlist: after a medic push, github.actor is this bot.
          printf 'login=%s\nid=%s\nhead=%s\nbots=%s\n' \
            "$login" "$id" "$(git rev-parse HEAD)" "$TRUSTED_BOTS" >>"$GITHUB_OUTPUT"

      - name: Run Claude Code
        if: env.HAS_CLAUDE == 'true'
        # Redirection is the hole the tool allowlist cannot close: the rules below are prefix
        # matches, so `gh run view --log > $GITHUB_ENV` is an allowed `gh run view`, and it puts
        # PR-controlled text in the runner's command file. BASH_ENV or PATH set there is read by
        # the *next* step -- the gate, holding the write token -- which would undo the whole
        # point of giving this step a read-only one. The step cannot sanitise its own
        # environment afterwards either: BASH_ENV is read before a run block's first line. So
        # the two files that execute code are pointed at throwaways. The runner reads back the
        # paths it assigned, which stay empty. GITHUB_OUTPUT and GITHUB_STATE are left alone:
        # they reach no other step, and the action needs them.
        env:
          GITHUB_ENV: ${{ runner.temp }}/discard/env
          GITHUB_PATH: ${{ runner.temp }}/discard/path
          # Best-effort, per the action's own docs, so it is the second line and not the first:
          # the job token being read-only is what makes DEFAULT_WORKFLOW_TOKEN worthless.
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
        uses: anthropics/claude-code-action@a874e9ecd7bb36efdad65429c6b35815f5a08f10 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ steps.token-ro.outputs.token }}
          allowed_bots: ${{ steps.bot.outputs.bots }}
          use_commit_signing: false
          bot_id: ${{ steps.bot.outputs.id }}
          bot_name: ${{ steps.bot.outputs.login }}
          # Inline, not a path: a checkout file is PR-controlled and not in SENSITIVE_PATHS.
          settings: |
            {"permissions":{"deny":["Bash(gh api:*)","Bash(gh pr comment:*)","Bash(gh pr merge:*)","Bash(gh pr review:*)","Bash(git push --force)","Bash(git push --force *)","Bash(just:*)","Bash(uv run:*)","Bash(git rebase --exec:*)","Bash(git rebase -x:*)","Bash(git fetch:*)","Bash(git push:*)","Bash(git push)","Bash(git commit:*)","Bash(git show:*)","Bash(git diff --no-index:*)","Bash(git diff --ext-diff:*)","Bash(git log --ext-diff:*)","Bash(git show --ext-diff:*)","Write(.git/**)","Edit(.git/**)","Read(.git/**)","Grep(.git/**)","Glob(.git/**)","Read(**/.git/**)"]}}
          # An allowlist, not only the deny block: agent mode sets neither --permission-mode
          # nor --allowedTools, so the model would otherwise have Read, Grep and Glob only.
          # Nothing on it launches a command, or reads or writes a file it names. rebase,
          # fetch, diff, commit, show, log and `gh pr comment` all could. ADR 0012.
          claude_args: >-
            --max-turns ${{ env.MAX_TURNS }}
            --permission-mode acceptEdits
            --add-dir ${{ runner.temp }}/pr-medic
            --allowedTools "Read,Grep,Glob,Edit,Write,TodoWrite,Bash(git status:*),Bash(git diff),Bash(git diff --stat),Bash(git diff --cached),Bash(git diff HEAD),Bash(git log --oneline -20),Bash(git rev-parse HEAD),Bash(git add:*),Bash(git checkout --ours:*),Bash(git checkout --theirs:*),Bash(git rebase --continue),Bash(git rebase --abort),Bash(${{ runner.temp }}/medic/rebase.sh),Bash(${{ runner.temp }}/medic/commit.sh:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh run view:*),Bash(gh run list:*)"
          prompt: ${{ steps.bot.outputs.prompt }}

      - if: failure()
        run: tail -c 4000 "$RUNNER_TEMP/claude-execution-output.json"

      - name: Gate and merge
        run: '"$RUNNER_TEMP/medic/after.sh"'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          HEAD_BEFORE: ${{ steps.bot.outputs.head }}
          TRUSTED_BOTS: ${{ steps.bot.outputs.bots }} # threads.sh apply must match dump
