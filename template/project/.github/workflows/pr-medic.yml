# pr-medic: drive open pull requests to merged. The logic lives in .github/pr-medic/; this
# file is orchestration only. It must not become a required check.
name: pr-medic

# workflow_run wants literal workflow names; there is no documented wildcard. These are this
# repo's aggregate workflows. A host whose names differ falls back to the hourly cron.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]
  issue_comment:
    types: [created]
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number; blank sweeps every open PR"
        required: false

permissions: {}

# Never cancel: a cancel between Claude resolving a thread and pushing the fix leaves the
# remote looking finished on a head the fix is missing from. Duplicate wakes queue instead,
# and each re-reads state. Only workflow_run fans out, so it collapses onto the head SHA.
concurrency:
  group: pr-medic-${{ github.event.workflow_run.head_sha || github.run_id }}
  cancel-in-progress: false

env:
  # 0, not 1: GitHub forbids self-approval and Copilot cannot approve, so 1 deadlocks a solo
  # maintainer. Raise it when a second human has write access. Counted by push permission.
  APPROVALS_REQUIRED: "0"
  # Set the repository variable to "true" to let the medic land pull requests unattended.
  ARM_AUTO_MERGE: ${{ vars.PR_MEDIC_ARM_AUTO_MERGE || 'false' }}
  MERGE_METHOD: squash # squash | rebase | merge
  SKIP_LABEL: no-medic
  REREQUEST_REVIEWERS: copilot-pull-request-reviewer[bot]
  # Bots whose event may wake the medic. The medic's own login is added at runtime; see the
  # `bot` step. This does not decide what the medic works on -- `pick` does that.
  TRIGGER_BOTS: copilot-pull-request-reviewer[bot],dependabot[bot]
  MAX_TURNS: "60"

jobs:
  pick:
    if: >-
      github.event_name != 'workflow_run'
      || contains(fromJSON('["success","failure","timed_out"]'), github.event.workflow_run.conclusion)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      checks: read
      statuses: read
      actions: read # statusCheckRollup resolves each check run's workflow name
    outputs:
      prs: ${{ steps.pick.outputs.prs }}
      count: ${{ steps.pick.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: pick
        run: .github/pr-medic/pick.sh
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_INPUT: ${{ inputs.pr }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}

  medic:
    needs: pick
    # Positive on every term: `count != '0'` alone admits the job when pick wrote no output,
    # and fromJSON('') below is a matrix expression error no job setting can absorb.
    if: needs.pick.outputs.count != '' && needs.pick.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: write
      pull-requests: write
      issues: write
      checks: read
      statuses: read
      actions: write
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        pr: ${{ fromJSON(needs.pick.outputs.prs) }}
    concurrency:
      group: pr-medic-${{ matrix.pr }}
      cancel-in-progress: false
    env:
      HAS_CLAUDE: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' || secrets.ANTHROPIC_API_KEY != '' }}
      PR: ${{ matrix.pr }}
      REPO: ${{ github.repository }}
    steps:
      # Without an App, pushes use GITHUB_TOKEN and do not re-trigger CI. An App token carries
      # the whole installation's scope and ignores this job's permissions: block, so downscope.
      - id: token
        if: vars.APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
          permission-checks: read
          permission-statuses: read
          # write, not read: the prompt tells Claude to `gh run rerun --failed`.
          permission-actions: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.token.outputs.token || github.token }}

      # Commits must carry the bot's noreply address, or a ruleset with
      # require_extra_approval_for_unattributed_changes blocks the PR.
      - id: bot
        env:
          GH_TOKEN: ${{ steps.token.outputs.token || github.token }}
          APP_SLUG: ${{ steps.token.outputs.app-slug }}
          TRIGGER_BOTS: ${{ env.TRIGGER_BOTS }}
        run: |
          set -euo pipefail
          login=${APP_SLUG:+${APP_SLUG}[bot]}
          login=${login:-github-actions[bot]}
          id=$(gh api "/users/$login" --jq .id)
          git config user.name "$login"
          git config user.email "$id+$login@users.noreply.github.com"
          gh auth setup-git
          gh pr checkout "$PR"
          # Everything below runs out of the checkout, which is now the PR's -- after.sh and
          # trust-config.sh included. Take .github/pr-medic from the default branch first, so
          # the gate guarding the merge is ours. On an entity event the workflow file is the
          # PR's too, so this closes schedule, dispatch and workflow_run only.
          base=$(gh api "repos/$REPO" --jq .default_branch)
          git fetch --depth=1 --no-recurse-submodules origin "$base"
          git checkout "origin/$base" -- .github/pr-medic ||
            echo "::warning::.github/pr-medic is absent from $base; using the PR's copy"
          git reset -q -- .github/pr-medic
          .github/pr-medic/trust-config.sh
          # The model gets the threads as a file and answers with a file; after.sh does the
          # replying, so `gh api` need not be on the allowlist at all.
          .github/pr-medic/threads.sh dump
          {
            echo "prompt<<PROMPT"
            cat .github/pr-medic/prompt.md
            echo PROMPT
          } >>"$GITHUB_OUTPUT"
          # $login leads the bot allowlist: on a workflow_run wake after a medic push
          # github.actor is this bot, and agent mode throws on a disallowed non-User actor.
          printf 'login=%s\nid=%s\nhead=%s\nbots=%s\n' \
            "$login" "$id" "$(git rev-parse HEAD)" "$login,$TRIGGER_BOTS" >>"$GITHUB_OUTPUT"

      - name: Run Claude Code
        if: env.HAS_CLAUDE == 'true'
        uses: anthropics/claude-code-action@9dcab633034361127cf74336d2d891d02e887881 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ steps.token.outputs.token || github.token }}
          allowed_bots: ${{ steps.bot.outputs.bots }}
          use_commit_signing: false
          bot_id: ${{ steps.bot.outputs.id }}
          bot_name: ${{ steps.bot.outputs.login }}
          # Inline, not a path: a file in the checkout is PR-controlled and is not in
          # SENSITIVE_PATHS, so trust-config.sh does not cover it.
          settings: |
            {"permissions":{"deny":["Bash(gh api:*)","Bash(gh pr merge:*)","Bash(gh pr review:*)","Bash(git push --force)","Bash(git push --force *)","Bash(just:*)","Bash(uv run:*)"]}}
          # An allowlist, not only the deny block: agent mode sets neither --permission-mode
          # nor --allowedTools, so the model would otherwise have Read, Grep and Glob and
          # could not work. No `gh api`, and no launcher that would run it anyway -- `just`
          # reads a PR-controlled justfile, `uv run` takes any argv. `--force-with-lease`
          # takes no refspec, which could name the default branch. See ADR 0012.
          claude_args: >-
            --max-turns ${{ env.MAX_TURNS }}
            --permission-mode acceptEdits
            --add-dir ${{ runner.temp }}/pr-medic
            --allowedTools "Read,Grep,Glob,Edit,Write,TodoWrite,Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git add:*),Bash(git commit:*),Bash(git fetch:*),Bash(git rebase:*),Bash(git checkout:*),Bash(git push),Bash(git push --force-with-lease),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh run view:*),Bash(gh run list:*),Bash(gh run rerun:*)"
          prompt: ${{ steps.bot.outputs.prompt }}

      # The action reports `is_error:true` without the message that caused it.
      - if: failure()
        run: tail -c 4000 "$RUNNER_TEMP/claude-execution-output.json"

      - name: Gate and arm
        run: .github/pr-medic/after.sh
        env:
          GH_TOKEN: ${{ steps.token.outputs.token || github.token }}
          HEAD_BEFORE: ${{ steps.bot.outputs.head }}
