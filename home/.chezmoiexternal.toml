# Files fetched from outside the repo: pinned to a commit and checksummed, never a moving
# branch. Off `master` any upstream commit changes the bytes, so the checksum stops
# matching and every apply fails until someone updates it here. A pinned commit fetches
# the same bytes forever.
#
# Homebrew ships hunspell with no dictionaries and macOS puts none in either search path,
# so without these `hunspell -D` lists nothing and every word reads as a miss.
#
# These are SCOWL (Kevin Atkinson's Spell Checker Oriented Word Lists) via the LibreOffice
# dictionaries repo. en_US-large is the alternative: large is SCOWL size 70 against 60 and
# its own README says it has not been checked for errors as carefully, so it trades false
# positives for false negatives. Swap the paths below if that is the better trade later.
#
# en_CA as well, because it is the locale /etc/zprofile sets: without it a bare `hunspell
# file.txt` fails outright rather than falling back, since hunspell resolves its default
# dictionary from LANG and has none to find. The two .aff files are byte-identical -- SCOWL
# shares the affix rules across the English variants and only the word list differs -- so the
# duplicated sha256 below is correct, not a copy-paste slip.
#
# Refreshed yearly only because the content cannot move under a pinned SHA -- the period
# keeps an apply off the network, it is not a staleness window.

["Library/Spelling/en_US.aff"]
type = "file"
url = "https://raw.githubusercontent.com/LibreOffice/dictionaries/208a9fd80b2a182fe20f224cd615119c6323ae2e/en/en_US.aff"
refreshPeriod = "8760h"
["Library/Spelling/en_US.aff".checksum]
sha256 = "e746c882dd6f303c2c46e7452804b9201115a6942cfeb15f18f8edf774d2e24e"

["Library/Spelling/en_US.dic"]
type = "file"
url = "https://raw.githubusercontent.com/LibreOffice/dictionaries/208a9fd80b2a182fe20f224cd615119c6323ae2e/en/en_US.dic"
refreshPeriod = "8760h"
["Library/Spelling/en_US.dic".checksum]
sha256 = "f0b1a234bd178bdd01875b2a392a9647f888b8fe879f79c52aae62c2759b3647"

