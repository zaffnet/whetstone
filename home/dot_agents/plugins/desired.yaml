# Plugin inventory. Tick names when you enable or disable them in a product.
# Do not also add plugin-provided servers to ../mcp.json.
#
# Not plugins on purpose: chrome-devtools and context7 are raw servers in
# ../mcp.json. The chrome-devtools plugin cannot pass --autoConnect; context7
# needs no plugin. playwright is disabled in Claude and Codex because it
# launches its own Chrome profile.

portable_capability:
  - github
  - figma
  - superpowers

claude_and_codex:
  - github@claude-plugins-official
  - figma@claude-plugins-official
  - superpowers@claude-plugins-official

cursor_equivalents:
  - github
  - playwright
  - figma

product_locked:
  - computer-use@openai-bundled
  - chrome@openai-bundled
  - docs-canvas
  - explanatory-output-style@claude-plugins-official
