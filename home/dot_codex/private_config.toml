model = "gpt-5.6-sol"
approval_policy = "on-request"
approvals_reviewer = "auto_review"
sandbox_mode = "workspace-write"
model_reasoning_effort = "xhigh"
personality = "pragmatic"
show_raw_agent_reasoning = false
hide_agent_reasoning = true
model_reasoning_summary = "concise"
model_verbosity = "low"
file_opener = "cursor"

[features]
browser_use = true
computer_use = true
apps = true
goals = true
hooks = true
js_repl = false
guardian_approval = true
prevent_idle_sleep = true
memories = true
shell_snapshot = true

[tui]
status_line = [
    "model-with-reasoning",
    "git-branch",
    "pull-request-number",
    "branch-changes",
    "context-remaining",
    "fast-mode",
    "permissions",
]
status_line_use_colors = true

[sandbox_workspace_write]
network_access = true

[memories]
generate_memories = true
use_memories = true

[shell_environment_policy]
inherit = "core"

[shell_environment_policy.set]
CLAUDE_CODE_MAX_OUTPUT_TOKENS = "128000"
CLAUDE_CODE_NO_FLICKER = "1"

[desktop]
followUpQueueMode = "steer"
preventSleepWhileRunning = true
git-pull-request-merge-method = "merge"
git-show-sidebar-pr-icons = true
notifications-turn-mode = "always"
conversationDetailMode = "STEPS_COMMANDS"
appearanceTheme = "system"
reviewDelivery = "inline"
git-branch-prefix = "zaffnet/"
git-worktree-root = "~/Desktop/src/"
git-create-pull-request-as-draft = true
show-context-window-usage = true
worktree-keep-count = 15
git-pr-instructions = """
## Description

<!-- Provide a brief summary of the change in 50 words or fewer. -->

## Checklist

- [ ] Design docs reflect the code changes.
- [ ] If this PR was generated by AI, the **AI Generated** label is applied."""
git-commit-instructions = """
Ensure the first line of the commit message is 72 characters or less. Ensure entire commit message is less than 100 words.

Follow the Conventional Commits format (conventionalcommits.org):

  <type>(scope): <subject>

Where type is one of: feat, fix, refactor, chore, docs, test, ci, style, perf, build. Use imperative mood ("add", "fix", "remove", not "added", "fixes", "removed")."""
enabled-reasoning-efforts = ["low", "medium", "high", "xhigh", "ultra", "persistent", "max"]
toys-audio-visualizer-enabled = true
toys-confetti-enabled = true

[desktop.open-in-target-preferences]
global = "cursor"

# Plugins shared with Claude Code (see ~/.agents/plugins/desired.yaml).
[plugins."github@claude-plugins-official"]
enabled = true
[plugins."pyright-lsp@claude-plugins-official"]
enabled = true
[plugins."typescript-lsp@claude-plugins-official"]
enabled = true
[plugins."claude-md-management@claude-plugins-official"]
enabled = true
[plugins."superpowers@claude-plugins-official"]
enabled = true
[plugins."playwright@claude-plugins-official"]
enabled = false

# [mcp_servers.*] is written by ~/.agents/bin/sync-mcp from ~/.agents/mcp.json after apply
# (.chezmoiscripts/run_after_40-sync-mcp.sh). One writer; Codex keeps its own
# private servers (node_repl, computer-use, event-stream) alongside.

# --- preserved sections (owned by Codex and bin/sync-mcp; chezmoi keeps them as-is) ---

[plugins."codex-app-tools@openai-bundled"]
enabled = true

[plugins."browser@openai-bundled"]
enabled = true

[plugins."chrome@openai-bundled"]
enabled = true

[plugins."computer-use@openai-bundled"]
enabled = true

[plugins."visualize@openai-bundled"]
enabled = true

[plugins."documents@openai-primary-runtime"]
enabled = true

[plugins."pdf@openai-primary-runtime"]
enabled = true

[plugins."spreadsheets@openai-primary-runtime"]
enabled = true

[plugins."presentations@openai-primary-runtime"]
enabled = true

[plugins."template-creator@openai-primary-runtime"]
enabled = true

[plugins."unified-computer-use@openai-bundled"]
enabled = true

# [mcp_servers.*] is written by ~/.agents/bin/sync-mcp from ~/.agents/mcp.json after apply
# (.chezmoiscripts/run_after_40-sync-mcp.sh). One writer; Codex keeps its own
# private servers (node_repl, computer-use, event-stream) alongside.

[mcp_servers.aws-mcp]
command = "uvx"
args = ["mcp-proxy-for-aws@1.6.4", "https://aws-mcp.us-east-1.api.aws/mcp", "--metadata", "INSTALL_SOURCE=aws-cli"]

[mcp_servers.aws-mcp.env]
AWS_REGION = "us-east-1"

[mcp_servers.awslabs-aws-iac-mcp]
command = "uvx"
args = ["awslabs.aws-iac-mcp-server@1.0.23"]

[mcp_servers.awslabs-aws-iac-mcp.env]
AWS_REGION = "us-east-1"
FASTMCP_LOG_LEVEL = "ERROR"

[mcp_servers.langfuse-docs]
url = "https://langfuse.com/api/mcp"

[mcp_servers.ms365]
command = "npx"
args = ["-y", "@softeria/ms-365-mcp-server@0.146.1", "--org-mode"]

[mcp_servers.primevue]
command = "npx"
args = ["-y", "@primevue/mcp@5.0.1"]

[mcp_servers.chrome-devtools]
command = "npx"
args = ["-y", "chrome-devtools-mcp@1.8.0", "--autoConnect"]

[mcp_servers.context7]
url = "https://mcp.context7.com/mcp"

[mcp_servers.mrc-mcp]
url = "https://www.microsoft.com/releasecommunications/mcp"
