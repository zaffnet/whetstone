# Copier template for a Python project: uv, ruff, mypy + basedpyright, pre-commit,
# GitHub Actions, and agent configuration for Claude Code, Codex, and Cursor.
#
#   uvx copier copy gh:zaffnet/whetstone my-project
#   uvx copier update            # later, from inside the project
_min_copier_version: "9.4.0"
_subdirectory: template/project
_templates_suffix: .jinja
_answers_file: .copier-answers.yml
_exclude:
  - "copier.yaml"
  - "copier.yml"
  - "~*"
  - "*.py[co]"
  - "__pycache__"
  - ".git"
  - ".DS_Store"
  - ".svn"
_skip_if_exists:
  - README.md
  - uv.lock
_message_after_copy: |
  {{ project_name }} is ready. Next:

    cd {{ _copier_conf.dst_path }}
    git init -b main
    uv sync --all-groups
    GIT_CONFIG_NOSYSTEM=1 uv run pre-commit install
    uv run pytest -qq

  Later, pull template updates with `uvx copier update`.

# 40 is the widest name the rendered Python can carry. The name is interpolated inline,
# and the widest of those lines is `runpy.run_module("<package_name>", ...)` in
# __main___test.py: 45 characters of fixed text, so 40 lands at 85, inside the
# 88-character floor on line_length. The template CI renders a 40-character name at 88.
project_name:
  type: str
  help: Project name (kebab-case, 40 characters or fewer; also the repository and distribution name)
  validator: >-
    {% if not (project_name | regex_search('^[a-z][a-z0-9]*(-[a-z0-9]+)*$')) %}
    Use kebab-case: lowercase letters, digits, single hyphens.
    {% elif project_name | length > 40 %}
    Keep it to 40 characters or fewer: it is interpolated into rendered Python, and
    those lines have to fit the narrowest line_length the template supports.
    {% endif %}

package_name:
  type: str
  help: Python import name (40 characters or fewer)
  default: "{{ project_name | replace('-', '_') }}"
  validator: >-
    {% if not (package_name | regex_search('^[a-z][a-z0-9_]*$')) %}
    Use a valid lowercase identifier.
    {% elif package_name | length > 40 %}
    Keep it to 40 characters or fewer, for the same reason as project_name.
    {% endif %}

description:
  type: str
  help: One-line description (80 characters or fewer)
  validator: >-
    {% if description | length > 80 %}
    Keep it to 80 characters or fewer: it becomes the package docstring, and
    ruff holds that to one line.
    {% endif %}

github_owner:
  type: str
  help: GitHub user or org

python_version:
  type: str
  help: Minimum Python version
  default: "3.12"
  choices:
    - "3.12"
    - "3.13"

line_length:
  type: int
  help: Line length for ruff and editors (88 or more)
  default: 100
  validator: >-
    {% if line_length < 88 %}
    Use 88 or more. The template is rendered and checked at 88 and 100; below that the
    scaffold can violate its own ruff config.
    {% endif %}

use_docker:
  type: bool
  help: Dockerfile, Compose stack with Postgres, container-version hook, Trivy scan in CI
  default: false

use_fastapi:
  type: bool
  help: FastAPI, uvicorn, pydantic-settings, httpx2, pytest-asyncio, and the async-safety reviewer agent
  default: false

license:
  type: str
  help: License
  default: MIT
  choices:
    - MIT
    - Apache-2.0
    - Proprietary

author:
  type: str
  help: Copyright holder named in LICENSE
  default: "{{ github_owner }}"
  when: "{{ license != 'Proprietary' }}"
