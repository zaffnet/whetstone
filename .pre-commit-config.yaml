# Runs on every commit. CI runs the same config (`pre-commit run --all-files`).
# Install: `uv run pre-commit install` (or `just install`); this also installs the
# commit-msg stage, which runs commitlint against ~/.config/commitlint.
default_install_hook_types: [pre-commit, commit-msg]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: ^template/project/
      - id: check-json
        exclude: ^template/project/
      - id: check-toml
        exclude: ^template/project/
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: check-symlinks
      - id: destroyed-symlinks
      - id: detect-private-key
      - id: detect-aws-credentials
        args: [--allow-missing-credentials]
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        # zsh files cannot be parsed as bash. The chezmoi scripts and modify_ templates are
        # bash with {{ }} inside quoted strings and comments, and are checked as written.
        exclude: ^(template/project/|home/dot_zsh|home/dot_zprofile|home/dot_p10k\.zsh)

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.13.1-1
    hooks:
      - id: shfmt
        args: [--indent=2, --case-indent, --binary-next-line, --write]
        exclude: ^(template/project/|home/dot_zsh|home/dot_zprofile|home/dot_p10k\.zsh)

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        # Template workflows contain Jinja and are validated after rendering (template.yml).
        exclude: ^template/project/

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.1
    hooks:
      - id: markdownlint
        exclude: ^(template/project/|skills/|agents/|home/)

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff-check
        args: [--fix]
        exclude: ^template/project/
      - id: ruff-format
        exclude: ^template/project/

  - repo: local
    hooks:
      # Matches lines against a machine-local denylist of private hostnames,
      # ids, and names. The file is never committed; when it is absent (CI, a
      # fresh clone) the hook is a no-op. See docs/redaction.md.
      - id: forbid-private-patterns
        name: forbid private patterns
        entry: bin/forbid-private-patterns
        language: script
        types: [text]
        exclude: ^\.gitleaks\.toml$

      # Each reviewer subagent exists as Claude markdown and Codex TOML; the
      # bodies must stay identical.
      #
      # always_run, not a `files` filter: pre-commit leaves deleted paths out of the
      # staged filename set, so a commit that only deletes one half of a pair would
      # skip the check and land the orphan.
      - id: check-agents-sync
        name: agents md/toml in sync
        # The script needs tomllib (3.11+); the system python3 on macOS is older.
        entry: uv run --no-sync python tools/check-agents-sync.py
        language: system
        pass_filenames: false
        always_run: true

      # `claude plugin validate .` checks plugin.json's paths but not the ones written
      # in marketplace.json, so a renamed agent file passes it.
      #
      # always_run for the same reason as check-agents-sync: deleting a path that
      # marketplace.json still names is exactly the break this catches, and a
      # deletion-only commit matches no `files` filter.
      - id: check-marketplace-paths
        name: marketplace paths exist
        entry: bin/check-marketplace-paths
        language: script
        pass_filenames: false
        always_run: true

      # commit-msg stage: conventional commits via the user-level commitlint config.
      - id: commitlint
        name: commitlint
        entry: bin/commitlint-msg
        language: script
        stages: [commit-msg]
