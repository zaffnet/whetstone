default_install_hook_types: [pre-commit, commit-msg]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: ^template/project/
      - id: check-json
        exclude: ^template/project/
      - id: check-toml
        exclude: ^template/project/
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: check-symlinks
      - id: destroyed-symlinks
      - id: detect-private-key
      - id: detect-aws-credentials
        args: [--allow-missing-credentials]
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        exclude: ^(template/project/|home/dot_zsh|home/dot_zprofile|home/dot_p10k\.zsh)

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.13.1-1
    hooks:
      - id: shfmt
        args: [--indent=2, --case-indent, --binary-next-line, --write]
        exclude: ^(template/project/|home/dot_zsh|home/dot_zprofile|home/dot_p10k\.zsh)

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        exclude: ^template/project/

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.1
    hooks:
      - id: markdownlint
        exclude: ^(template/project/|skills/|agents/|home/)

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      - id: ruff-check
        args: [--fix]
        exclude: ^template/project/
      - id: ruff-format
        exclude: ^template/project/

  - repo: local
    hooks:
      - id: check-agents-sync
        name: agents md/toml in sync
        entry: uv run --no-sync python tools/check-agents-sync.py
        language: system
        pass_filenames: false
        always_run: true

      - id: check-marketplace-paths
        name: marketplace paths exist
        entry: bin/check-marketplace-paths
        language: script
        pass_filenames: false
        always_run: true

      - id: commitlint
        name: commitlint
        entry: bin/commitlint-msg
        language: script
        stages: [commit-msg]
